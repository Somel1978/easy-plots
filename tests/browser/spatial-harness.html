<html lang="en"><head><meta charset="utf-8"><title>Spatial atlas DOM acceptance</title><link rel="stylesheet" href="/static/easy-plots.css"></head><body>
<main id="windows"></main>
<script type="module">

 constructor(){this.element=document.createElement('article');document.querySelector('#windows').append(this.element);}
 async render(){this.element.replaceChildren(await this._renderHTML());return this;}

}
const fixture=await spatialFixture(),hostile='<img src=x onerror="window.__spatialInjected=true">',receipt=await fixture.receipt('chromium_hostile',hostile);
